<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MIOsler: plataforma de estudio y apoyo para residentes de Medicina Interna</title>
<meta name="theme-color" content="#2f6f5e">
<meta name="description" content="MIOsler: estudio, calculadoras y protocolos para residentes de Medicina Interna.">
<link rel="canonical" href="https://miosler.com/">
<!-- Tarjeta de enlace compartido. Para esta app importa mas que el SEO: el canal por el que
     llega un residente es el grupo de WhatsApp de su sede, no una busqueda en Google, y ahi un
     enlace sin estas etiquetas se pinta como una URL pelada que nadie abre. Ademas el SEO poco
     puede hacer aqui: el contenido lo pinta JS detras de la puerta de auth, asi que un rastreador
     solo ve el cromo del header. Estas etiquetas, en cambio, viven en el <head> estatico y
     funcionan sin ejecutar una linea de JavaScript.
     Dos cosas que muerden: og:image TIENE que ser absoluta (una ruta relativa la ignoran todos
     los clientes, y es el fallo clasico), y las previsualizaciones se cachean con fuerza en el
     lado de WhatsApp y Telegram, asi que cambiar la imagen mas adelante NO refresca los enlaces
     que ya circulan: habria que publicarla con otro nombre de archivo.
     icons/og-card.png NO va al precache de sw.js a proposito: la pide el rastreador, nunca la
     app, y serian 48 KB en el telefono de cada residente para nada. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="MIOsler">
<meta property="og:locale" content="es_MX">
<meta property="og:url" content="https://miosler.com/">
<meta property="og:title" content="MIOsler: plataforma de estudio para residentes de Medicina Interna">
<meta property="og:description" content="Temario de Medicina Interna con autoevaluación, repaso espaciado, calculadoras clínicas y protocolos. Funciona sin conexión y sincroniza tu progreso entre dispositivos.">
<meta property="og:image" content="https://miosler.com/icons/og-card.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="MIOsler: plataforma de estudio para residentes de Medicina Interna.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="MIOsler: plataforma de estudio para residentes de Medicina Interna">
<meta name="twitter:description" content="Temario de Medicina Interna con autoevaluación, repaso espaciado, calculadoras clínicas y protocolos. Funciona sin conexión y sincroniza tu progreso entre dispositivos.">
<meta name="twitter:image" content="https://miosler.com/icons/og-card.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="engine/styles.css">
</head>
<body>

<div class="app-shell">

  <header class="app-header">
    <div class="brand-mark"><img src="icons/icon-192.png" alt="MIOsler"></div>
    <div class="brand-txt">
      <h1 id="app-title">MIOsler</h1>
      <span id="app-subtitle">Medicina Interna</span>
    </div>
    <div class="topic-switch" id="topic-switch-slot"></div>
    <div class="account-menu">
      <button id="account-gear" class="account-gear-btn" aria-label="Cuenta">
        <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.03-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.03 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1.03z"/></svg>
      </button>
      <div id="account-dropdown" class="account-dropdown">
        <button id="menu-my-account">Mi cuenta</button>
        <button id="menu-change-password">Cambiar contraseña</button>
        <a href="mailto:waltijau321@gmail.com?subject=MIOsler%3A%20reporte%20o%20sugerencia" id="menu-feedback">Reportar un problema</a>
        <button id="menu-about">Acerca de MIOsler</button>
        <div class="account-dropdown-sep"></div>
        <div class="account-theme-row">
          <span>Tema</span>
          <select id="menu-theme-select" aria-label="Tema de la aplicación">
            <option value="auto">Automático</option>
            <option value="light">Claro</option>
            <option value="dark">Oscuro</option>
          </select>
        </div>
        <div class="account-dropdown-sep"></div>
        <button id="menu-signout" class="account-danger">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main class="app-main">
    <section class="app-section active" id="sec-inicio"><div id="home-root"></div></section>
    <section class="app-section" id="sec-estudio"><div id="study-root"></div></section>
    <section class="app-section" id="sec-calc"><div id="calc-root"></div></section>
    <section class="app-section" id="sec-protocolos"><div id="proto-root"></div></section>
    <section class="app-section" id="sec-vpo"><div id="vpo-root"></div></section>
    <section class="app-section" id="sec-pediatria"><div id="pedia-root"></div></section>
    <section class="app-section" id="sec-admin"><div id="admin-root"></div></section>
    <section class="app-section" id="sec-examen"><div id="examen-root"></div></section>
  </main>

  <nav class="app-nav">
    <button class="nav-item active" data-sec="inicio" id="nav-inicio">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
      Inicio
    </button>
    <button class="nav-item" data-sec="calc" id="nav-calc">
      <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h4"/></svg>
      Calc
    </button>
    <button class="nav-item" data-sec="protocolos" id="nav-protocolos">
      <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 13l2 2 4-4"/></svg>
      Protocolos
    </button>
    <button class="nav-item" data-sec="vpo" id="nav-vpo">
      <svg viewBox="0 0 24 24"><path d="M9 2v3M15 2v3M5 8h14M5 5h14a1 1 0 0 1 1 1v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a1 1 0 0 1 1-1z"/><path d="M9 13l2 2 4-4"/></svg>
      VPO
    </button>
    <button class="nav-item" data-sec="pediatria" id="nav-pediatria" style="display:none;">
      <svg viewBox="0 0 24 24"><path d="M10.5 4V2.6a1.5 1.5 0 0 1 3 0V4"/><path d="M9 4h6v2.5H9z"/><path d="M9 6.5h6V19a2.5 2.5 0 0 1-2.5 2.5h-1A2.5 2.5 0 0 1 9 19V6.5z"/><path d="M11 10.5h2M11 13.5h2"/></svg>
      Pediatría
    </button>
    <button class="nav-item" data-sec="admin" id="nav-admin" style="display:none;">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Admin
    </button>
  </nav>

</div>

<!-- Notas del tema: panel de comentarios por tema (ver engine/topic-chat.js).
     Vive FUERA de .app-shell, como hijo directo de <body>, y eso no es cosmético: mountStudy()
     reconstruye #study-root entero en cada cambio de tema, y .app-section.active conserva para
     siempre un transform (la animación section-in usa fill-mode:both), que convertiría a la
     sección en bloque contenedor de cualquier descendiente position:fixed. Dentro del shell, el
     panel se comportaría distinto según la preferencia de movimiento reducido del usuario. -->
<button class="chat-fab" id="chat-fab" type="button" hidden
        aria-label="Notas de este tema" aria-expanded="false" aria-controls="topic-chat">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>
  <span class="chat-fab-count" id="chat-fab-count" hidden></span>
</button>
<div class="chat-scrim" id="chat-scrim"></div>
<aside class="topic-chat" id="topic-chat" hidden aria-label="Notas del tema">
  <header class="chat-head">
    <div class="chat-head-top">
      <h2>Notas del tema</h2>
      <button class="chat-close" id="chat-close" type="button" aria-label="Cerrar las notas">&#10005;</button>
    </div>
    <p class="chat-sub" id="chat-sub"></p>
    <p class="chat-disclaimer">Aportaciones de los residentes sobre este tema, al margen del contenido: mnemotecnias, enlaces, correcciones y dudas. Cada nota es responsabilidad de quien la escribe. No publiques datos de pacientes.</p>
  </header>
  <div class="chat-pinned" id="chat-pinned" hidden></div>
  <div class="chat-list" id="chat-list" tabindex="0" aria-label="Notas publicadas"></div>
  <button class="chat-jump" id="chat-jump" type="button" hidden>Notas nuevas &#8595;</button>
  <div class="chat-compose" id="chat-compose"></div>
  <p class="chat-status" id="chat-status" aria-live="polite"></p>
</aside>

<div class="overlay" id="overlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true" tabindex="-1"></div>
</div>

<!-- Los terminos viven en su propio overlay, por encima de #overlay: se abren DESDE el modal de
     registro, que sigue activo debajo. De ahi que lleven sus propias semanticas de dialogo, y que
     la trampa de foco de study-view.js tenga que elegir la capa de arriba en vez de mirar solo
     #overlay. tabindex="-1" es lo que permite meter el foco aqui al abrir. -->
<div class="overlay" id="terms-overlay">
  <div class="modal terms-modal" id="terms-modal" role="dialog" aria-modal="true"
       aria-label="Términos y condiciones" tabindex="-1"></div>
</div>

<!-- Lightbox para ampliar a pantalla completa cualquier imagen dentro de una figura didáctica o
     un estigma (ver openImgLightbox/closeImgLightbox en engine/study-view.js). Overlay propio,
     independiente de #overlay/#modal, para quedar por encima de un modal de contenido abierto. -->
<div class="img-lightbox" id="img-lightbox" onclick="closeImgLightbox()">
  <button class="img-lightbox-close" onclick="closeImgLightbox()" aria-label="Cerrar imagen ampliada" title="Cerrar">✕</button>
  <img id="img-lightbox-img" src="" alt="">
</div>

<script type="module" src="app.js"></script>
</body>
</html>
