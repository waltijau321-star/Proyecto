<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ResidenteMed — Medicina Interna</title>
<meta name="theme-color" content="#2f6f5e">
<meta name="description" content="Plataforma de estudio, calculadoras, protocolos y calendario de guardias para residentes de Medicina Interna.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="engine/styles.css">
</head>
<body>

<div class="app-shell">

  <header class="app-header">
    <div class="brand-mark"><img src="icons/icon-192.png" alt="ResidenteMed"></div>
    <div class="brand-txt">
      <h1 id="app-title">ResidenteMed</h1>
      <span id="app-subtitle">Medicina Interna</span>
    </div>
    <div class="topic-switch">
      <select id="topic-select" aria-label="Cambiar tema de estudio"></select>
    </div>
  </header>

  <main class="app-main">
    <section class="app-section active" id="sec-inicio"><div id="home-root"></div></section>
    <section class="app-section" id="sec-estudio"><div id="study-root"></div></section>
    <section class="app-section" id="sec-calc"><div id="calc-root"></div></section>
    <section class="app-section" id="sec-protocolos"><div id="proto-root"></div></section>
    <section class="app-section" id="sec-calendario"><div id="cal-root"></div></section>
    <section class="app-section" id="sec-vpo"><div id="vpo-root"></div></section>
  </main>

  <nav class="app-nav">
    <button class="nav-item active" data-sec="inicio" id="nav-inicio">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
      Inicio
    </button>
    <button class="nav-item" data-sec="estudio" id="nav-estudio">
      <svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h11a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 1 2-2h12"/></svg>
      Estudio
    </button>
    <button class="nav-item" data-sec="calc" id="nav-calc">
      <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h4"/></svg>
      Calc
    </button>
    <button class="nav-item" data-sec="protocolos" id="nav-protocolos">
      <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 13l2 2 4-4"/></svg>
      Protocolos
    </button>
    <button class="nav-item" data-sec="calendario" id="nav-calendario">
      <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16"/></svg>
      Calendario
    </button>
    <button class="nav-item" data-sec="vpo" id="nav-vpo">
      <svg viewBox="0 0 24 24"><path d="M9 2v3M15 2v3M5 8h14M5 5h14a1 1 0 0 1 1 1v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a1 1 0 0 1 1-1z"/><path d="M9 13l2 2 4-4"/></svg>
      VPO
    </button>
  </nav>

</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
